<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kalkulator obron SWPS Poznań</title>
    <meta name="description" content="Aplikacja do obliczania ocen z egzaminu dyplomowego SWPS Poznań">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#1e40af">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="./icons/icon-192x192.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        input, select, textarea {
            -webkit-user-select: auto;
            user-select: auto;
        }
        body {
            overflow-x: hidden;
            touch-action: pan-y;
        }
        .tab-content {
            min-height: calc(100vh - 120px);
        }
        @media (max-width: 640px) {
            .mobile-card {
                min-height: auto;
            }
        }
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }
        .install-button {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        select {
            scroll-margin: 0;
        }
    </style>
</head>
<body class="bg-gray-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useLayoutEffect } = React;

        const MobileGradingApp = () => {
            const [activeTab, setActiveTab] = useState('ocenianie');
            const [deferredPrompt, setDeferredPrompt] = useState(null);
            const [showInstallButton, setShowInstallButton] = useState(false);

            const [question1, setQuestion1] = useState({
                wiedza: '',
                struktura: '',
                ocena: null,
                showButtons: false,
                possibleGrades: []
            });

            const [question2, setQuestion2] = useState({
                wiedza: '',
                struktura: '',
                ocena: null,
                showButtons: false,
                possibleGrades: []
            });

            const [srednieOcenStudia, setSrednieOcenStudia] = useState('');
            const [ocenaPraca, setOcenaPraca] = useState('');
            const [ocenaEgzaminuOverride, setOcenaEgzaminuOverride] = useState('');

            const gradeRules = {
                'celujący_celujący': [5.0],
                'celujący_bardzo dobry': [5.0, 4.5],
                'celujący_dobry plus': [4.5, 5.0],
                'celujący_dobry': [4.5, 4.0],
                'celujący_dostateczny plus': [4.0, 4.5],
                'celujący_dostateczny': [4.0, 3.5],
                'celujący_niedostateczny': [3.5, 3.0],
                'bardzo dobry_celujący': [5.0, 4.5],
                'bardzo dobry_bardzo dobry': [4.5, 5.0],
                'bardzo dobry_dobry plus': [4.5, 4.0],
                'bardzo dobry_dobry': [4.0, 4.5],
                'bardzo dobry_dostateczny plus': [4.0, 3.5],
                'bardzo dobry_dostateczny': [3.5, 4.0],
                'bardzo dobry_niedostateczny': [3.5, 3.0],
                'dobry plus_celujący': [5.0, 4.5],
                'dobry plus_bardzo dobry': [4.5, 4.0],
                'dobry plus_dobry plus': [4.0, 4.5],
                'dobry plus_dobry': [4.0],
                'dobry plus_dostateczny plus': [3.5, 4.0],
                'dobry plus_dostateczny': [3.5],
                'dobry plus_niedostateczny': [3.0, 3.5],
                'dobry_celujący': [4.5, 4.0],
                'dobry_bardzo dobry': [4.5, 4.0],
                'dobry_dobry plus': [4.0],
                'dobry_dobry': [4.0, 3.5],
                'dobry_dostateczny plus': [3.5, 4.0],
                'dobry_dostateczny': [3.5, 3.0],
                'dobry_niedostateczny': [3.0, 3.5],
                'dostateczny plus_celujący': [4.0, 4.5],
                'dostateczny plus_bardzo dobry': [4.0, 3.5],
                'dostateczny plus_dobry plus': [4.0, 3.5],
                'dostateczny plus_dobry': [3.5, 4.0],
                'dostateczny plus_dostateczny plus': [3.5],
                'dostateczny plus_dostateczny': [3.5, 3.0],
                'dostateczny plus_niedostateczny': [3.0],
                'dostateczny_celujący': [4.0, 3.5],
                'dostateczny_bardzo dobry': [4.0, 3.5],
                'dostateczny_dobry plus': [3.5],
                'dostateczny_dobry': [3.5, 3.0],
                'dostateczny_dostateczny plus': [3.0, 3.5],
                'dostateczny_dostateczny': [3.0],
                'dostateczny_niedostateczny': [3.0, 2.0],
                'niedostateczny_celujący': [3.5, 3.0],
                'niedostateczny_bardzo dobry': [3.5, 3.0],
                'niedostateczny_dobry plus': [3.0, 3.5],
                'niedostateczny_dobry': [3.0, 3.5],
                'niedostateczny_dostateczny plus': [3.0],
                'niedostateczny_dostateczny': [3.0, 2.0],
                'niedostateczny_niedostateczny': [2.0]
            };

            const handleCriteriaChange = (questionNum, field, value) => {
                // Prevent any scrolling by saving position and restoring immediately
                const currentScroll = window.scrollY;
                
                const setQuestion = questionNum === 1 ? setQuestion1 : setQuestion2;
                const currentQuestion = questionNum === 1 ? question1 : question2;
                
                // Use setTimeout to ensure scroll restoration happens after any potential scroll
                setTimeout(() => {
                    window.scrollTo(0, currentScroll);
                }, 0);

                const updatedQuestion = { ...currentQuestion, [field]: value };
                
                if (updatedQuestion.wiedza && updatedQuestion.struktura) {
                    const key = `${updatedQuestion.wiedza}_${updatedQuestion.struktura}`;
                    const grades = gradeRules[key] || [];
                    updatedQuestion.possibleGrades = grades;
                    updatedQuestion.showButtons = grades.length > 0;
                    if (grades.length === 1) {
                        updatedQuestion.ocena = grades[0];
                    } else if (!grades.includes(updatedQuestion.ocena)) {
                        updatedQuestion.ocena = null;
                    }
                } else {
                    updatedQuestion.possibleGrades = [];
                    updatedQuestion.showButtons = false;
                    updatedQuestion.ocena = null;
                }
                
                setQuestion(updatedQuestion);
            };

            const selectGrade = (questionNum, grade) => {
                // Prevent any scrolling
                const currentScroll = window.scrollY;
                
                const setQuestion = questionNum === 1 ? setQuestion1 : setQuestion2;
                const currentQuestion = questionNum === 1 ? question1 : question2;
                setQuestion({ ...currentQuestion, ocena: grade });
                
                // Force scroll position to stay
                setTimeout(() => {
                    window.scrollTo(0, currentScroll);
                }, 0);
            };

            const calculateAverage = () => {
                const validGrades = [question1.ocena, question2.ocena].filter(g => g !== null);
                if (validGrades.length === 0) return 0;
                return validGrades.reduce((sum, grade) => sum + grade, 0) / validGrades.length;
            };

            const formatGrade = (grade) => {
                if (grade === null || grade === undefined || grade === '') return '-';
                return grade.toFixed(1).replace('.', ',');
            };

            const calculateFinalExamGrade = () => {
                const avg = calculateAverage();
                if (avg === 0) return null;
                if (avg >= 4.75) return 5.0;
                if (avg >= 4.25) return 4.5;
                if (avg >= 3.75) return 4.0;
                if (avg >= 3.25) return 3.5;
                return 3.0;
            };

            const calculateWeightedAverage = () => {
                const studiesGrade = srednieOcenStudia.replace(',', '.');
                const thesisGrade = ocenaPraca;
                let examGrade = ocenaEgzaminuOverride || calculateFinalExamGrade();
                
                if (!studiesGrade || !thesisGrade || !examGrade) return null;
                
                const studies = parseFloat(studiesGrade);
                const thesis = parseFloat(thesisGrade);
                const exam = parseFloat(examGrade);
                
                if (isNaN(studies) || isNaN(thesis) || isNaN(exam)) return null;
                
                return (0.6 * studies + 0.2 * thesis + 0.2 * exam).toFixed(2);
            };

            const calculateDiplomaGrade = () => {
                const weighted = calculateWeightedAverage();
                if (!weighted) return '-';
                
                const avg = parseFloat(weighted);
                if (avg >= 4.60) return "5,0";
                if (avg >= 4.20) return "4,5";
                if (avg >= 3.70) return "4,0";
                if (avg >= 3.20) return "3,5";
                return "3,0";
            };

            const resetAllData = () => {
                setQuestion1({
                    wiedza: '',
                    struktura: '',
                    ocena: null,
                    showButtons: false,
                    possibleGrades: []
                });
                setQuestion2({
                    wiedza: '',
                    struktura: '',
                    ocena: null,
                    showButtons: false,
                    possibleGrades: []
                });
                setSrednieOcenStudia('');
                setOcenaPraca('');
                setOcenaEgzaminuOverride('');
                setActiveTab('ocenianie');
            };

            const installPWA = async () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    if (outcome === 'accepted') {
                        setShowInstallButton(false);
                    }
                    setDeferredPrompt(null);
                }
            };

            // PWA Installation
            useEffect(() => {
                const handleBeforeInstallPrompt = (e) => {
                    e.preventDefault();
                    setDeferredPrompt(e);
                    setShowInstallButton(true);
                };

                window.addEventListener('beforeinstallprompt', handleBeforeInstallPrompt);

                return () => {
                    window.removeEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
                };
            }, []);

            // Prevent scroll to top on any state change in the ocenianie tab
            useEffect(() => {
                if (activeTab === 'ocenianie') {
                    // Capture scroll position before any potential scroll
                    let lastScroll = window.scrollY;
                    
                    const preventScroll = (e) => {
                        if (e.target.tagName === 'SELECT') {
                            e.preventDefault();
                            e.target.scrollIntoView = () => {};
                        }
                    };
                    
                    const maintainScroll = () => {
                        if (window.scrollY === 0 && lastScroll > 0) {
                            window.scrollTo(0, lastScroll);
                        }
                        lastScroll = window.scrollY;
                    };
                    
                    // Add listeners
                    document.addEventListener('focusin', preventScroll, true);
                    document.addEventListener('scroll', maintainScroll);
                    
                    return () => {
                        document.removeEventListener('focusin', preventScroll, true);
                        document.removeEventListener('scroll', maintainScroll);
                    };
                }
            }, [activeTab]);

            // Register Service Worker
            useEffect(() => {
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.register('./sw.js')
                        .then(registration => console.log('Service Worker registered'))
                        .catch(error => console.log('Service Worker registration failed:', error));
                }
            }, []);

            return (
                React.createElement('div', { className: "min-h-screen bg-gray-100 pb-20" },
                    // Header
                    React.createElement('div', { className: "bg-gradient-to-r from-blue-800 to-blue-600 text-white p-4 shadow-lg" },
                        React.createElement('div', { className: "max-w-4xl mx-auto" },
                            React.createElement('h1', { className: "text-2xl font-bold" }, "Kalkulator obron SWPS Poznań"),
                            React.createElement('p', { className: "text-sm opacity-90 mt-1" }, "Oblicz ocenę z egzaminu dyplomowego")
                        )
                    ),

                    // Tab Navigation
                    React.createElement('div', { className: "bg-white shadow-md sticky top-0 z-10" },
                        React.createElement('div', { className: "max-w-4xl mx-auto flex" },
                            React.createElement('button', {
                                onClick: () => setActiveTab('ocenianie'),
                                className: `flex-1 py-3 px-4 font-semibold transition-colors ${activeTab === 'ocenianie' ? 'bg-blue-600 text-white' : 'bg-white text-gray-700 hover:bg-gray-100'}`
                            }, "1. Ocenianie"),
                            React.createElement('button', {
                                onClick: () => setActiveTab('wyniki'),
                                className: `flex-1 py-3 px-4 font-semibold transition-colors ${activeTab === 'wyniki' ? 'bg-blue-600 text-white' : 'bg-white text-gray-700 hover:bg-gray-100'}`
                            }, "2. Wyniki")
                        )
                    ),

                    // Content
                    React.createElement('div', { className: "max-w-4xl mx-auto p-4 tab-content" },
                        activeTab === 'ocenianie' ? (
                            React.createElement('div', { className: "space-y-6" },
                                // Question 1
                                React.createElement('div', { className: "bg-white rounded-lg shadow-md p-6 mobile-card" },
                                    React.createElement('h2', { className: "text-lg font-bold mb-4 text-blue-800" }, "Pytanie 1"),
                                    React.createElement('div', { className: "space-y-4" },
                                        React.createElement('div', null,
                                            React.createElement('label', { className: "block text-sm font-semibold mb-1 text-gray-700" }, "Wiedza merytoryczna:"),
                                            React.createElement('select', {
                                                value: question1.wiedza,
                                                onChange: (e) => {
                                                    e.preventDefault();
                                                    const scroll = window.scrollY;
                                                    handleCriteriaChange(1, 'wiedza', e.target.value);
                                                    requestAnimationFrame(() => window.scrollTo(0, scroll));
                                                },
                                                onMouseDown: (e) => {
                                                    e.target.dataset.scroll = window.scrollY;
                                                },
                                                onFocus: (e) => {
                                                    e.target.scrollIntoView = () => {};
                                                },
                                                style: { scrollMargin: 0 },
                                                className: "w-full p-2 border-2 border-gray-300 rounded-md focus:border-blue-500 focus:outline-none"
                                            },
                                                React.createElement('option', { value: "" }, "Wybierz ocenę..."),
                                                React.createElement('option', { value: "celujący" }, "celujący"),
                                                React.createElement('option', { value: "bardzo dobry" }, "bardzo dobry"),
                                                React.createElement('option', { value: "dobry plus" }, "dobry plus"),
                                                React.createElement('option', { value: "dobry" }, "dobry"),
                                                React.createElement('option', { value: "dostateczny plus" }, "dostateczny plus"),
                                                React.createElement('option', { value: "dostateczny" }, "dostateczny"),
                                                React.createElement('option', { value: "niedostateczny" }, "niedostateczny")
                                            )
                                        ),
                                        React.createElement('div', null,
                                            React.createElement('label', { className: "block text-sm font-semibold mb-1 text-gray-700" }, "Struktura pracy:"),
                                            React.createElement('select', {
                                                value: question1.struktura,
                                                onChange: (e) => {
                                                    e.preventDefault();
                                                    const scroll = window.scrollY;
                                                    handleCriteriaChange(1, 'struktura', e.target.value);
                                                    requestAnimationFrame(() => window.scrollTo(0, scroll));
                                                },
                                                onMouseDown: (e) => {
                                                    e.target.dataset.scroll = window.scrollY;
                                                },
                                                onFocus: (e) => {
                                                    e.target.scrollIntoView = () => {};
                                                },
                                                style: { scrollMargin: 0 },
                                                className: "w-full p-2 border-2 border-gray-300 rounded-md focus:border-blue-500 focus:outline-none"
                                            },
                                                React.createElement('option', { value: "" }, "Wybierz ocenę..."),
                                                React.createElement('option', { value: "celujący" }, "celujący"),
                                                React.createElement('option', { value: "bardzo dobry" }, "bardzo dobry"),
                                                React.createElement('option', { value: "dobry plus" }, "dobry plus"),
                                                React.createElement('option', { value: "dobry" }, "dobry"),
                                                React.createElement('option', { value: "dostateczny plus" }, "dostateczny plus"),
                                                React.createElement('option', { value: "dostateczny" }, "dostateczny"),
                                                React.createElement('option', { value: "niedostateczny" }, "niedostateczny")
                                            )
                                        ),
                                        question1.showButtons && question1.possibleGrades.length > 1 && (
                                            React.createElement('div', null,
                                                React.createElement('label', { className: "block text-sm font-semibold mb-2 text-gray-700" }, "Wybierz ocenę:"),
                                                React.createElement('div', { className: "flex gap-2 flex-wrap" },
                                                    question1.possibleGrades.map(grade => 
                                                        React.createElement('button', {
                                                            key: grade,
                                                            onClick: () => selectGrade(1, grade),
                                                            className: `px-4 py-2 rounded-md font-bold transition-all ${
                                                                question1.ocena === grade 
                                                                    ? 'bg-blue-600 text-white shadow-lg transform scale-105' 
                                                                    : 'bg-gray-200 text-gray-700 hover:bg-gray-300'
                                                            }`
                                                        }, formatGrade(grade))
                                                    )
                                                )
                                            )
                                        ),
                                        React.createElement('div', { className: "mt-4 p-3 bg-blue-50 rounded-md border-l-4 border-blue-600" },
                                            React.createElement('span', { className: "font-bold text-blue-800" }, 
                                                `Ocena z pytania 1: ${formatGrade(question1.ocena)}`
                                            )
                                        )
                                    )
                                ),

                                // Question 2
                                React.createElement('div', { className: "bg-white rounded-lg shadow-md p-6 mobile-card" },
                                    React.createElement('h2', { className: "text-lg font-bold mb-4 text-blue-800" }, "Pytanie 2"),
                                    React.createElement('div', { className: "space-y-4" },
                                        React.createElement('div', null,
                                            React.createElement('label', { className: "block text-sm font-semibold mb-1 text-gray-700" }, "Wiedza merytoryczna:"),
                                            React.createElement('select', {
                                                value: question2.wiedza,
                                                onChange: (e) => {
                                                    e.preventDefault();
                                                    const scroll = window.scrollY;
                                                    handleCriteriaChange(2, 'wiedza', e.target.value);
                                                    requestAnimationFrame(() => window.scrollTo(0, scroll));
                                                },
                                                onMouseDown: (e) => {
                                                    e.target.dataset.scroll = window.scrollY;
                                                },
                                                onFocus: (e) => {
                                                    e.target.scrollIntoView = () => {};
                                                },
                                                style: { scrollMargin: 0 },
                                                className: "w-full p-2 border-2 border-gray-300 rounded-md focus:border-blue-500 focus:outline-none"
                                            },
                                                React.createElement('option', { value: "" }, "Wybierz ocenę..."),
                                                React.createElement('option', { value: "celujący" }, "celujący"),
                                                React.createElement('option', { value: "bardzo dobry" }, "bardzo dobry"),
                                                React.createElement('option', { value: "dobry plus" }, "dobry plus"),
                                                React.createElement('option', { value: "dobry" }, "dobry"),
                                                React.createElement('option', { value: "dostateczny plus" }, "dostateczny plus"),
                                                React.createElement('option', { value: "dostateczny" }, "dostateczny"),
                                                React.createElement('option', { value: "niedostateczny" }, "niedostateczny")
                                            )
                                        ),
                                        React.createElement('div', null,
                                            React.createElement('label', { className: "block text-sm font-semibold mb-1 text-gray-700" }, "Struktura pracy:"),
                                            React.createElement('select', {
                                                value: question2.struktura,
                                                onChange: (e) => {
                                                    e.preventDefault();
                                                    const scroll = window.scrollY;
                                                    handleCriteriaChange(2, 'struktura', e.target.value);
                                                    requestAnimationFrame(() => window.scrollTo(0, scroll));
                                                },
                                                onMouseDown: (e) => {
                                                    e.target.dataset.scroll = window.scrollY;
                                                },
                                                onFocus: (e) => {
                                                    e.target.scrollIntoView = () => {};
                                                },
                                                style: { scrollMargin: 0 },
                                                className: "w-full p-2 border-2 border-gray-300 rounded-md focus:border-blue-500 focus:outline-none"
                                            },
                                                React.createElement('option', { value: "" }, "Wybierz ocenę..."),
                                                React.createElement('option', { value: "celujący" }, "celujący"),
                                                React.createElement('option', { value: "bardzo dobry" }, "bardzo dobry"),
                                                React.createElement('option', { value: "dobry plus" }, "dobry plus"),
                                                React.createElement('option', { value: "dobry" }, "dobry"),
                                                React.createElement('option', { value: "dostateczny plus" }, "dostateczny plus"),
                                                React.createElement('option', { value: "dostateczny" }, "dostateczny"),
                                                React.createElement('option', { value: "niedostateczny" }, "niedostateczny")
                                            )
                                        ),
                                        question2.showButtons && question2.possibleGrades.length > 1 && (
                                            React.createElement('div', null,
                                                React.createElement('label', { className: "block text-sm font-semibold mb-2 text-gray-700" }, "Wybierz ocenę:"),
                                                React.createElement('div', { className: "flex gap-2 flex-wrap" },
                                                    question2.possibleGrades.map(grade => 
                                                        React.createElement('button', {
                                                            key: grade,
                                                            onClick: () => selectGrade(2, grade),
                                                            className: `px-4 py-2 rounded-md font-bold transition-all ${
                                                                question2.ocena === grade 
                                                                    ? 'bg-blue-600 text-white shadow-lg transform scale-105' 
                                                                    : 'bg-gray-200 text-gray-700 hover:bg-gray-300'
                                                            }`
                                                        }, formatGrade(grade))
                                                    )
                                                )
                                            )
                                        ),
                                        React.createElement('div', { className: "mt-4 p-3 bg-blue-50 rounded-md border-l-4 border-blue-600" },
                                            React.createElement('span', { className: "font-bold text-blue-800" }, 
                                                `Ocena z pytania 2: ${formatGrade(question2.ocena)}`
                                            )
                                        )
                                    )
                                ),

                                // Summary
                                React.createElement('div', { className: "bg-gradient-to-r from-blue-600 to-blue-700 text-white rounded-lg shadow-lg p-6" },
                                    React.createElement('h3', { className: "text-xl font-bold mb-2" }, "Podsumowanie"),
                                    React.createElement('div', { className: "space-y-2" },
                                        React.createElement('p', null, `Średnia z pytań: ${formatGrade(calculateAverage())}`),
                                        React.createElement('p', { className: "text-2xl font-bold" }, 
                                            `Ocena z egzaminu: ${formatGrade(calculateFinalExamGrade())}`
                                        )
                                    )
                                )
                            )
                        ) : (
                            React.createElement('div', { className: "space-y-6" },
                                // Inputs for final calculation
                                React.createElement('div', { className: "bg-white rounded-lg shadow-md p-6" },
                                    React.createElement('h2', { className: "text-lg font-bold mb-4 text-blue-800" }, "Oblicz ocenę końcową na dyplomie"),
                                    React.createElement('div', { className: "space-y-4" },
                                        React.createElement('div', null,
                                            React.createElement('label', { className: "block text-sm font-semibold mb-1 text-gray-700" }, 
                                                "Średnia ocen ze studiów (0,6):"
                                            ),
                                            React.createElement('input', {
                                                type: "text",
                                                inputMode: "decimal",
                                                pattern: "[0-9]*[,.]?[0-9]*",
                                                value: srednieOcenStudia,
                                                onChange: (e) => {
                                                    const value = e.target.value.replace(/[^0-9.,]/g, '');
                                                    setSrednieOcenStudia(value);
                                                },
                                                onBlur: (e) => {
                                                    const value = e.target.value.replace(',', '.');
                                                    const num = parseFloat(value);
                                                    if (!isNaN(num) && num >= 2 && num <= 5) {
                                                        setSrednieOcenStudia(num.toFixed(2).replace('.', ','));
                                                    } else if (e.target.value) {
                                                        alert('Ocena musi być między 2.0 a 5.0');
                                                        setSrednieOcenStudia('');
                                                    }
                                                },
                                                placeholder: "np. 3,50",
                                                className: "w-full p-2 border-2 border-gray-300 rounded-md focus:border-blue-500 focus:outline-none"
                                            })
                                        ),
                                        React.createElement('div', null,
                                            React.createElement('label', { className: "block text-sm font-semibold mb-1 text-gray-700" }, 
                                                "Ocena pracy (0,2):"
                                            ),
                                            React.createElement('select', {
                                                value: ocenaPraca,
                                                onChange: (e) => setOcenaPraca(e.target.value),
                                                className: "w-full p-2 border-2 border-gray-300 rounded-md focus:border-blue-500 focus:outline-none"
                                            },
                                                React.createElement('option', { value: "" }, "Wybierz ocenę..."),
                                                React.createElement('option', { value: "3.0" }, "3,0"),
                                                React.createElement('option', { value: "3.5" }, "3,5"),
                                                React.createElement('option', { value: "4.0" }, "4,0"),
                                                React.createElement('option', { value: "4.5" }, "4,5"),
                                                React.createElement('option', { value: "5.0" }, "5,0")
                                            )
                                        ),
                                        React.createElement('div', null,
                                            React.createElement('label', { className: "block text-sm font-semibold mb-1 text-gray-700" }, 
                                                "Ocena egzaminu (0,2):"
                                            ),
                                            React.createElement('select', {
                                                value: ocenaEgzaminuOverride || (calculateFinalExamGrade() ? 
                                                    calculateFinalExamGrade().toString() : ''),
                                                onChange: (e) => setOcenaEgzaminuOverride(e.target.value),
                                                className: "w-full p-2 border-2 border-gray-300 rounded-md focus:border-blue-500 focus:outline-none"
                                            },
                                                React.createElement('option', { value: "" }, "Wybierz ocenę..."),
                                                React.createElement('option', { value: "3.0" }, "3,0"),
                                                React.createElement('option', { value: "3.5" }, "3,5"),
                                                React.createElement('option', { value: "4.0" }, "4,0"),
                                                React.createElement('option', { value: "4.5" }, "4,5"),
                                                React.createElement('option', { value: "5.0" }, "5,0")
                                            )
                                        )
                                    )
                                ),

                                // Results table
                                React.createElement('div', { className: "bg-white rounded-lg shadow-md p-6" },
                                    React.createElement('h3', { className: "text-lg font-bold mb-4 text-blue-800" }, "Tabela obliczeń"),
                                    React.createElement('div', { className: "overflow-x-auto" },
                                        React.createElement('table', { className: "w-full border-collapse" },
                                            React.createElement('thead', null,
                                                React.createElement('tr', { className: "bg-gray-100" },
                                                    React.createElement('th', { className: "border p-2 text-left" }, "Składnik"),
                                                    React.createElement('th', { className: "border p-2 text-center" }, "Ocena"),
                                                    React.createElement('th', { className: "border p-2 text-center" }, "Waga"),
                                                    React.createElement('th', { className: "border p-2 text-center" }, "Wynik")
                                                )
                                            ),
                                            React.createElement('tbody', null,
                                                React.createElement('tr', null,
                                                    React.createElement('td', { className: "border p-2" }, "Średnia ze studiów"),
                                                    React.createElement('td', { className: "border p-2 text-center" }, 
                                                        srednieOcenStudia || '-'
                                                    ),
                                                    React.createElement('td', { className: "border p-2 text-center" }, "0,6"),
                                                    React.createElement('td', { className: "border p-2 text-center font-semibold" }, 
                                                        srednieOcenStudia ? 
                                                            (parseFloat(srednieOcenStudia.replace(',', '.')) * 0.6).toFixed(2).replace('.', ',') : '-'
                                                    )
                                                ),
                                                React.createElement('tr', null,
                                                    React.createElement('td', { className: "border p-2" }, "Ocena pracy"),
                                                    React.createElement('td', { className: "border p-2 text-center" }, 
                                                        ocenaPraca ? ocenaPraca.replace('.', ',') : '-'
                                                    ),
                                                    React.createElement('td', { className: "border p-2 text-center" }, "0,2"),
                                                    React.createElement('td', { className: "border p-2 text-center font-semibold" }, 
                                                        ocenaPraca ? 
                                                            (parseFloat(ocenaPraca) * 0.2).toFixed(2).replace('.', ',') : '-'
                                                    )
                                                ),
                                                React.createElement('tr', null,
                                                    React.createElement('td', { className: "border p-2" }, "Ocena egzaminu"),
                                                    React.createElement('td', { className: "border p-2 text-center" }, 
                                                        (ocenaEgzaminuOverride || calculateFinalExamGrade()) ?
                                                            (ocenaEgzaminuOverride || calculateFinalExamGrade()).toString().replace('.', ',') : '-'
                                                    ),
                                                    React.createElement('td', { className: "border p-2 text-center" }, "0,2"),
                                                    React.createElement('td', { className: "border p-2 text-center font-semibold" }, 
                                                        (ocenaEgzaminuOverride || calculateFinalExamGrade()) ? 
                                                            (parseFloat(ocenaEgzaminuOverride || calculateFinalExamGrade()) * 0.2).toFixed(2).replace('.', ',') : '-'
                                                    )
                                                ),
                                                React.createElement('tr', { className: "bg-blue-50 font-bold" },
                                                    React.createElement('td', { className: "border p-2" }, "Suma ważona"),
                                                    React.createElement('td', { className: "border p-2 text-center", colSpan: "2" }, ""),
                                                    React.createElement('td', { className: "border p-2 text-center text-blue-800" }, 
                                                        calculateWeightedAverage() ? 
                                                            calculateWeightedAverage().replace('.', ',') : '-'
                                                    )
                                                )
                                            )
                                        )
                                    )
                                ),

                                // Final grade
                                React.createElement('div', { className: "bg-gradient-to-r from-green-600 to-green-700 text-white rounded-lg shadow-lg p-6" },
                                    React.createElement('h3', { className: "text-xl font-bold mb-2" }, "Ocena końcowa na dyplomie"),
                                    React.createElement('p', { className: "text-4xl font-bold" }, calculateDiplomaGrade()),
                                    React.createElement('p', { className: "text-sm mt-2 opacity-90" }, 
                                        "Zgodnie z Regulaminem Studiów SWPS"
                                    )
                                ),

                                // Reset button
                                React.createElement('button', {
                                    onClick: resetAllData,
                                    className: "w-full bg-red-600 text-white py-3 px-4 rounded-lg font-semibold hover:bg-red-700 transition-colors"
                                }, "Wyczyść wszystkie dane")
                            )
                        ),

                        // Install button
                        showInstallButton && (
                            React.createElement('button', {
                                onClick: installPWA,
                                className: "fixed bottom-4 right-4 bg-green-600 text-white px-4 py-2 rounded-full shadow-lg install-button hover:bg-green-700 transition-all flex items-center gap-2"
                            },
                                React.createElement('span', null, "📲"),
                                React.createElement('span', null, "Zainstaluj aplikację")
                            )
                        )
                    )
                )
            );
        };

        ReactDOM.render(React.createElement(MobileGradingApp), document.getElementById('root'));
    </script>

    <script>
        // Register Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(registration => console.log('SW registered'))
                    .catch(error => console.log('SW registration failed:', error));
            });
        }
    </script>
</body>
</html>
